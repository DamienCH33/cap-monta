<details class="report">
  <summary class="report__toggle">Signaler cette annonce</summary>

  @if (sent()) {
    <p class="report__done" role="status">
      Merci. Votre signalement est enregistré et sera examiné rapidement. Une photo où une personne
      est reconnaissable est traitée en priorité.
    </p>
  } @else {
    <form class="report__form" (ngSubmit)="submit()" novalidate>
      <fieldset class="report__reasons">
        <legend class="report__label">Pourquoi ?</legend>
        @for (option of reasons; track option.value) {
          <label class="report__reason">
            <input
              type="radio"
              name="reason"
              [value]="option.value"
              [ngModel]="reason()"
              (ngModelChange)="reason.set($event)"
            />
            {{ option.label }}
          </label>
        }
      </fieldset>

      <label class="report__field">
        <span class="report__label">Précisions (facultatif)</span>
        <textarea
          name="message"
          rows="3"
          maxlength="1000"
          [ngModel]="message()"
          (ngModelChange)="message.set($event)"
        ></textarea>
      </label>

      <label class="report__field">
        <span class="report__label">Votre email (facultatif, pour vous répondre)</span>
        <input
          type="email"
          name="email"
          autocomplete="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
        />
      </label>

      @if (error(); as message) {
        <p class="report__error" role="alert">{{ message }}</p>
      }

      <button type="submit" class="report__submit" [disabled]="sending()">
        {{ sending() ? 'Envoi…' : 'Envoyer le signalement' }}
      </button>
    </form>
  }
</details>
