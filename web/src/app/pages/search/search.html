<div class="container">
  <cm-search-bar
    [initialArrival]="criteria().arrival ?? ''"
    [initialDeparture]="criteria().departure ?? ''"
    [initialGuests]="criteria().guests ?? 2"
  />

  <p class="results__count">
    {{ results().length }} {{ results().length > 1 ? 'logements' : 'logement' }}
  </p>

  <div class="results">
    @for (accommodation of results(); track accommodation.slug) {
      <cm-accommodation-card [accommodation]="accommodation" />
    } @empty {
      <p class="results__empty">Aucun logement disponible sur ces dates.</p>
    }
  </div>

  <div class="legend">
    <span><i class="legend__swatch legend__swatch--free"></i> libre</span>
    <span><i class="legend__swatch legend__swatch--taken"></i> réservé</span>
  </div>
</div>
