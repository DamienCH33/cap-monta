<div class="container auth">
  <div class="auth__card">
    <h1 class="auth__title">Nouveau mot de passe</h1>

    @if (usable) {
      <p class="auth__intro">Choisissez un mot de passe que vous n'utilisez nulle part ailleurs.</p>

      <form class="auth__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        @if (failed(); as message) {
          <p class="auth__notice auth__notice--error" role="alert">{{ message }}</p>
        }

        <label class="auth__field">
          <span class="auth__label">Mot de passe</span>
          <input
            type="password"
            formControlName="password"
            autocomplete="new-password"
            required
            [attr.aria-invalid]="showError()"
          />
          @if (showError()) {
            <span class="auth__error" role="alert">
              Votre mot de passe doit faire au moins 10 caractères.
            </span>
          } @else {
            <span class="auth__hint">
              10 caractères minimum. Quatre mots au hasard font un excellent mot de passe.
            </span>
          }
        </label>

        <button type="submit" class="auth__submit" [disabled]="submitting()">
          {{ submitting() ? 'Enregistrement…' : 'Enregistrer' }}
        </button>
      </form>
    } @else {
      <p class="auth__notice auth__notice--warn">
        Ce lien est incomplet. Demandez-en un nouveau depuis la page de connexion.
      </p>
      <p><a routerLink="/mot-de-passe-oublie">Recevoir un nouveau lien</a></p>
    }
  </div>
</div>
