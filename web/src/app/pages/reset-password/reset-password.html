<div class="container auth">
  <div class="auth__card">
    <h1 class="auth__title" i18n="@@owner.entry.reset-title">Nouveau mot de passe</h1>

    @if (usable) {
      <p class="auth__intro" i18n="@@owner.entry.reset-intro">
        Choisissez un mot de passe que vous n'utilisez nulle part ailleurs.
      </p>

      <form class="auth__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        @if (failed(); as message) {
          <p class="auth__notice auth__notice--error" role="alert">{{ message }}</p>
        }

        <label class="auth__field">
          <span class="auth__label" i18n="@@owner.entry.password-label">Mot de passe</span>
          <input
            type="password"
            formControlName="password"
            autocomplete="new-password"
            required
            [attr.aria-invalid]="showError()"
          />
          @if (showError()) {
            <span class="auth__error" role="alert" i18n="@@owner.entry.password-too-short">
              Votre mot de passe doit faire au moins 10 caractères.
            </span>
          } @else {
            <span class="auth__hint" i18n="@@owner.entry.password-hint">
              10 caractères minimum. Quatre mots au hasard font un excellent mot de passe.
            </span>
          }
        </label>

        <button type="submit" class="auth__submit" [disabled]="submitting()">
          @if (submitting()) {
            <ng-container i18n="@@owner.entry.reset-submitting">Enregistrement…</ng-container>
          } @else {
            <ng-container i18n="@@owner.entry.reset-submit">Enregistrer</ng-container>
          }
        </button>
      </form>
    } @else {
      <p class="auth__notice auth__notice--warn" i18n="@@owner.entry.reset-link-incomplete">
        Ce lien est incomplet. Demandez-en un nouveau depuis la page de connexion.
      </p>
      <p>
        <a routerLink="/mot-de-passe-oublie" i18n="@@owner.entry.reset-new-link"
          >Recevoir un nouveau lien</a
        >
      </p>
    }
  </div>
</div>
