<form class="searchbar" (ngSubmit)="submit()">
  <div class="searchbar__field">
    <span class="searchbar__label" id="searchbar-dates" i18n="@@search.dates">Dates</span>
    <cm-date-range
      aria-labelledby="searchbar-dates"
      [arrival]="arrival()"
      (arrivalChange)="onArrivalChange($event)"
      [(departure)]="departure"
    />
  </div>

  <div class="searchbar__field searchbar__field--guests">
    <span class="searchbar__label" i18n="@@search.guests">Voyageurs</span>
    <cm-guest-picker [(value)]="guests" />
  </div>

  <button class="searchbar__submit" type="submit">
    <svg
      viewBox="0 0 24 24"
      width="18"
      height="18"
      fill="none"
      stroke="currentColor"
      stroke-width="2.4"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <circle cx="11" cy="11" r="7" />
      <path d="m20 20-3.5-3.5" />
    </svg>
    <span i18n="@@search.submit">Rechercher</span>
  </button>
</form>
