<svg
  viewBox="0 0 400 300"
  preserveAspectRatio="xMidYMid slice"
  aria-hidden="true"
  focusable="false"
>
  <defs>
    <symbol id="cm-pine" viewBox="0 0 40 90">
      <rect x="18" y="36" width="4" height="54" fill="#5b4a3a" />
      <path d="M20 4 C8 10 2 22 6 30 C12 36 28 36 34 30 C38 22 32 10 20 4Z" fill="#2c5540" />
      <path d="M20 14 C11 18 8 26 12 31 C16 34 26 34 29 30 C32 25 28 17 20 14Z" fill="#3a6a50" />
    </symbol>
    <symbol id="cm-bungalow" viewBox="0 0 120 70">
      <path d="M8 34 L60 8 L112 34Z" fill="#8a5a3c" />
      <rect x="18" y="32" width="84" height="34" fill="#f1e8d8" />
      <rect x="28" y="42" width="18" height="24" fill="#7a9aa8" />
      <rect x="58" y="42" width="30" height="14" fill="#9fc0cf" />
      <rect x="10" y="64" width="100" height="4" fill="#b7a07c" />
    </symbol>
    <symbol id="cm-mobil" viewBox="0 0 130 60">
      <rect x="6" y="18" width="118" height="34" rx="4" fill="#f4f1ea" />
      <rect x="6" y="14" width="118" height="6" rx="2" fill="#c9d3d6" />
      <rect x="18" y="26" width="26" height="14" fill="#8fb3c4" />
      <rect x="54" y="26" width="16" height="26" fill="#6f8f9d" />
      <rect x="82" y="26" width="30" height="14" fill="#8fb3c4" />
      <rect x="0" y="50" width="130" height="4" fill="#a99774" />
    </symbol>
    <symbol id="cm-caravan" viewBox="0 0 110 60">
      <path d="M10 20 Q10 10 22 10 L86 10 Q100 10 100 26 L100 44 L10 44Z" fill="#f2efe8" />
      <rect x="22" y="18" width="22" height="12" rx="3" fill="#8fb3c4" />
      <rect x="56" y="18" width="30" height="12" rx="3" fill="#8fb3c4" />
      <circle cx="40" cy="48" r="7" fill="#3a3f42" />
      <rect x="0" y="52" width="110" height="4" fill="#a99774" />
    </symbol>
    <symbol id="cm-chalet" viewBox="0 0 120 80">
      <path d="M10 40 L60 6 L110 40Z" fill="#6d4a33" />
      <rect x="20" y="38" width="80" height="38" fill="#c79a6b" />
      <rect x="34" y="48" width="16" height="28" fill="#7a5a44" />
      <rect x="62" y="48" width="26" height="16" fill="#9fc0cf" />
      <rect x="12" y="74" width="96" height="4" fill="#9c8662" />
    </symbol>
  </defs>

  @switch (kind()) {
    @case ('dunes') {
      <rect width="400" height="300" fill="#a9cbdc" />
      <rect y="140" width="400" height="160" fill="#2f7ea3" />
      <path d="M0 160 H400" stroke="#d9ecf3" stroke-width="2" opacity=".6" />
      <path d="M140 300 C200 230 280 200 400 190 V300Z" fill="#e2d3b0" />
      <use href="#cm-pine" x="300" y="70" width="44" height="100" />
      <use href="#cm-pine" x="340" y="54" width="54" height="122" />
    }
    @case ('central') {
      <rect width="400" height="300" fill="#dfe8e3" />
      <rect y="210" width="400" height="90" fill="#c9d8c7" />
      <use href="#cm-pine" x="10" y="40" width="60" height="170" />
      <use href="#cm-pine" x="62" y="70" width="46" height="140" />
      <use href="#cm-bungalow" x="130" y="130" width="150" height="88" />
      <use href="#cm-pine" x="290" y="20" width="64" height="190" />
      <use href="#cm-pine" x="344" y="56" width="50" height="152" />
    }
    @case ('roadside') {
      <rect width="400" height="300" fill="#d6e1d6" />
      <rect y="220" width="400" height="80" fill="#bccdb8" />
      <use href="#cm-pine" x="0" y="20" width="66" height="200" />
      <use href="#cm-pine" x="56" y="44" width="54" height="176" />
      <use href="#cm-pine" x="104" y="10" width="70" height="210" />
      <use href="#cm-mobil" x="186" y="150" width="160" height="74" />
      <use href="#cm-pine" x="340" y="30" width="60" height="190" />
    }
    @case ('owner') {
      <rect width="400" height="300" fill="#dfe8e3" />
      <rect y="210" width="400" height="90" fill="#c7d4bf" />
      <use href="#cm-pine" x="0" y="30" width="70" height="190" />
      <use href="#cm-pine" x="320" y="10" width="80" height="210" />
      <use href="#cm-bungalow" x="70" y="104" width="240" height="140" />
      <rect x="236" y="40" width="130" height="78" rx="10" fill="#fff" />
      <rect x="252" y="58" width="74" height="8" rx="4" fill="#1d6f97" />
      <rect x="252" y="74" width="98" height="6" rx="3" fill="#c9d3d6" />
      <rect x="252" y="86" width="84" height="6" rx="3" fill="#c9d3d6" />
      <rect x="252" y="98" width="56" height="6" rx="3" fill="#c9d3d6" />
    }
    @case ('caravan') {
      <rect width="400" height="300" fill="#a9cbdc" />
      <rect y="150" width="400" height="60" fill="#2f7ea3" />
      <path d="M0 300 V200 C120 180 260 176 400 186 V300Z" fill="#e2d3b0" />
      <use href="#cm-caravan" x="80" y="150" width="240" height="130" />
      <use href="#cm-pine" x="320" y="70" width="70" height="170" />
    }
    @case ('mobile_home') {
      <rect width="400" height="300" fill="#e5ece6" />
      <rect y="210" width="400" height="90" fill="#cfd9c6" />
      <use href="#cm-pine" x="260" y="0" width="100" height="220" />
      <use href="#cm-pine" x="-20" y="30" width="70" height="170" />
      <use href="#cm-mobil" x="50" y="140" width="270" height="124" />
    }
    @case ('chalet') {
      <rect width="400" height="300" fill="#dde6df" />
      <rect y="214" width="400" height="86" fill="#c7d4bf" />
      <use href="#cm-pine" x="-10" y="20" width="80" height="190" />
      <use href="#cm-chalet" x="90" y="100" width="220" height="146" />
      <use href="#cm-pine" x="310" y="10" width="90" height="206" />
    }
    @default {
      <rect width="400" height="300" fill="#d9e5de" />
      <rect y="200" width="400" height="100" fill="#c7d4bf" />
      <use href="#cm-pine" x="-10" y="10" width="80" height="190" />
      <use href="#cm-pine" x="300" y="0" width="90" height="210" />
      <use href="#cm-bungalow" x="70" y="110" width="250" height="146" />
    }
  }
</svg>
