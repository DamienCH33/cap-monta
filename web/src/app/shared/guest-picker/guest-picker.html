<button type="button" class="picker__toggle" [attr.aria-expanded]="open()" (click)="toggle()">
  @if (summary()) {
    {{ summary() }}
  } @else {
    <span class="picker__placeholder">Ajouter des voyageurs</span>
  }
</button>

@if (open()) {
  <div class="picker__panel" role="dialog" aria-label="Choisir les voyageurs">
    @for (row of rows; track row.key) {
      <div class="picker__row">
        <div>
          <p class="picker__title">{{ row.title }}</p>
          <p class="picker__hint">{{ row.hint }}</p>
        </div>

        <div class="picker__counter">
          <button
            type="button"
            [disabled]="!canDecrement(row.key)"
            [attr.aria-label]="'Retirer : ' + row.title"
            (click)="decrement(row.key)"
          >
            −
          </button>
          <span aria-live="polite">{{ value()[row.key] }}</span>
          <button
            type="button"
            [disabled]="!canIncrement(row.key)"
            [attr.aria-label]="'Ajouter : ' + row.title"
            (click)="increment(row.key)"
          >
            +
          </button>
        </div>
      </div>
    }

    <p class="picker__note">
      Les bébés ne comptent pas dans la capacité du logement. Bébés et animaux sont signalés au
      propriétaire dans votre demande.
    </p>

    <button type="button" class="picker__close" (click)="close()">Fermer</button>
  </div>
}
