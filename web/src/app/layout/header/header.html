<header class="header">
  <div class="container header__inner">
    <a class="header__brand" routerLink="/">
      <cm-icon name="beach" class="brand-icon" />
      <span>Cap Monta</span>
    </a>

    <button
      type="button"
      class="header__toggle"
      aria-controls="main-nav"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <cm-icon [name]="menuOpen() ? 'x' : 'menu-2'" />
      <span>Menu</span>
    </button>

    <nav id="main-nav" class="header__nav" [class.header__nav--open]="menuOpen()">
      <a routerLink="/recherche">Rechercher</a>

      @if (guestRequests().length && null === owner()) {
        <a routerLink="/mes-demandes">Mes demandes</a>
      }

      @if (null !== owner()) {
        <a routerLink="/mon-espace">Mon espace</a>
      } @else {
        <a class="header__cta" routerLink="/proprietaire">Louer mon logement</a>
      }

      <span class="header__account">
        @if (sessionChecked()) {
          @if (owner(); as me) {
            <a class="header__who" routerLink="/mon-espace/profil" title="Mon profil">{{
              me.displayName
            }}</a>
            <button type="button" class="header__logout" (click)="logout()">Se déconnecter</button>
          } @else {
            <a routerLink="/connexion">Se connecter</a>
          }
        }
      </span>
    </nav>
  </div>
</header>
