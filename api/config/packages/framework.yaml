framework:
    secret: "%env(APP_SECRET)%"
    trusted_proxies: "%env(TRUSTED_PROXIES)%"
    trusted_headers: ["x-forwarded-for", "x-forwarded-proto"]

    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        cookie_httponly: true

    http_client:
        scoped_clients:
            # L'assistant d'import (Mistral). Au-delà, l'appel échoue et l'import est marqué
            # « à réessayer » : mieux qu'un worker bloqué.
            mistral.client:
                scope: 'https://api\.mistral\.ai'
                timeout: 30
                max_duration: 90

    exceptions:
        Symfony\Component\HttpKernel\Exception\BadRequestHttpException:
            log_level: info
        ApiPlatform\Validator\Exception\ValidationException:
            log_level: info

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
