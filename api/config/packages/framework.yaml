framework:
    secret: "%env(APP_SECRET)%"
    trusted_proxies: "%env(TRUSTED_PROXIES)%"
    trusted_headers: ["x-forwarded-for", "x-forwarded-proto"]

    session:
        # Sessions en base (PostgreSQL) : elles survivent à un redéploiement sur Railway, et
        # plusieurs instances les partagent. Dans des fichiers, chaque déploiement déconnectait
        # tous les propriétaires. Table « sessions », créée par une migration.
        handler_id: '%env(DATABASE_URL)%'
        cookie_secure: auto
        cookie_samesite: lax
        cookie_httponly: true

    http_client:
        scoped_clients:
            # L'assistant d'import (Mistral). Au-delà, l'appel échoue et l'import est marqué
            # « à réessayer » : mieux qu'un worker bloqué.
            mistral.client:
                scope: 'https://api\.mistral\.ai'
                timeout: 30
                max_duration: 90

    exceptions:
        Symfony\Component\HttpKernel\Exception\BadRequestHttpException:
            log_level: info
        ApiPlatform\Validator\Exception\ValidationException:
            log_level: info

when@prod:
    framework:
        session:
            # Derrière HTTPS uniquement en production : « auto » dépendrait de TRUSTED_PROXIES.
            cookie_secure: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
