framework:
    rate_limiter:
        # Une demande de réservation est un acte rare : cinq en un quart d'heure
        # depuis la même adresse, c'est déjà beaucoup.
        booking_requests:
            policy: "sliding_window"
            limit: 5
            interval: "15 minutes"

        # Un devis est consulté en tapotant des dates : on est plus large,
        # mais on plafonne pour qu'un script ne martèle pas la base.
        quotes:
            policy: "sliding_window"
            limit: 60
            interval: "1 minute"

        # Une inscription est un acte unique. Trois par heure et par IP, c'est large
        # pour un foyer, et ça empêche d'utiliser le formulaire comme une machine
        # à envoyer des emails à des inconnus.
        registrations:
            policy: "sliding_window"
            limit: 3
            interval: "1 hour"

        # Un oubli de mot de passe arrive, un script qui en demande cinquante non.
        password_resets:
            policy: "sliding_window"
            limit: 5
            interval: "1 hour"

        # « Retrouver mes demandes » envoie un email à l'adresse saisie : même garde-fou
        # que le mot de passe oublié, pour que le formulaire ne serve pas à spammer.
        booking_recoveries:
            policy: "sliding_window"
            limit: 5
            interval: "1 hour"

# Un test ne doit jamais échouer parce qu'un compteur partagé est plein.
when@test:
    framework:
        rate_limiter:
            booking_requests:
                limit: 1000
            quotes:
                limit: 1000
            registrations:
                limit: 1000
            password_resets:
                limit: 1000
            booking_recoveries:
                limit: 1000

# Assez large pour travailler, assez bas pour croiser le 429 de temps en temps
# et se souvenir qu'il existe.
when@dev:
    framework:
        rate_limiter:
            booking_requests:
                limit: 30
            registrations:
                limit: 20
            password_resets:
                limit: 20
            booking_recoveries:
                limit: 20
