framework:
    rate_limiter:
        # Tous les compteurs sont dans PostgreSQL (rate_limiter.cache, ADR 021), sans verrou :
        # deux requêtes simultanées peuvent passer à une près, sans importance pour un plafond.
        # Une demande de réservation est un acte rare : cinq en un quart d'heure
        # depuis la même adresse, c'est déjà beaucoup.
        booking_requests:
            policy: "sliding_window"
            cache_pool: rate_limiter.cache
            lock_factory: null
            limit: 5
            interval: "15 minutes"

        # Un devis est consulté en tapotant des dates : on est plus large,
        # mais on plafonne pour qu'un script ne martèle pas la base.
        quotes:
            policy: "sliding_window"
            cache_pool: rate_limiter.cache
            lock_factory: null
            limit: 60
            interval: "1 minute"

        # Une inscription est un acte unique. Trois par heure et par IP, c'est large
        # pour un foyer, et ça empêche d'utiliser le formulaire comme une machine
        # à envoyer des emails à des inconnus.
        registrations:
            policy: "sliding_window"
            cache_pool: rate_limiter.cache
            lock_factory: null
            limit: 3
            interval: "1 hour"

        # Un oubli de mot de passe arrive, un script qui en demande cinquante non.
        password_resets:
            policy: "sliding_window"
            cache_pool: rate_limiter.cache
            lock_factory: null
            limit: 5
            interval: "1 hour"

        # « Retrouver mes demandes » envoie un email à l'adresse saisie : même garde-fou
        # que le mot de passe oublié, pour que le formulaire ne serve pas à spammer.
        booking_recoveries:
            policy: "sliding_window"
            cache_pool: rate_limiter.cache
            lock_factory: null
            limit: 5
            interval: "1 hour"

        # « Prévenez-moi » envoie un email à l'adresse saisie : même garde-fou que « Retrouver
        # mes demandes », pour que le formulaire ne serve pas à écrire à des inconnus.
        stay_alerts:
            policy: "sliding_window"
            cache_pool: rate_limiter.cache
            lock_factory: null
            limit: 5
            interval: "1 hour"

        # Un signalement est rare ; un script qui en envoie cent inonde la boîte de modération.
        listing_reports:
            policy: "sliding_window"
            cache_pool: rate_limiter.cache
            lock_factory: null
            limit: 5
            interval: "1 hour"

        # Assistant de lecture d'annonce (ADR 027) : la formule gratuite du fournisseur d'IA a
        # des plafonds. Dix lectures par propriétaire et par jour, c'est dix annonces : large.
        listing_imports_owner:
            policy: "sliding_window"
            cache_pool: rate_limiter.cache
            lock_factory: null
            limit: 10
            interval: "1 day"
        # Envoi de photos : chacune est redimensionnée (jusqu'à 512 Mo de mémoire). Douze
        # photos par annonce ; soixante par heure laisse refaire plusieurs annonces, pas
        # saturer le serveur.
        photo_uploads:
            policy: "sliding_window"
            cache_pool: rate_limiter.cache
            lock_factory: null
            limit: 60
            interval: "1 hour"

        # Alerte « nouvelle annonce en ligne » à l'éditeur : publier, retirer, republier en boucle
        # ne doit pas épuiser le quota d'emails (les emails de réservation passeraient après).
        # Trois alertes par propriétaire et par jour ; au-delà, l'annonce est publiée sans alerte.
        moderation_alerts:
            policy: "sliding_window"
            cache_pool: rate_limiter.cache
            lock_factory: null
            limit: 3
            interval: "1 day"

        # Et un plafond pour tout le site : un bug ou une série de comptes ne vide pas le quota.
        listing_imports_all:
            policy: "fixed_window"
            cache_pool: rate_limiter.cache
            lock_factory: null
            limit: 300
            interval: "1 day"

        # Connexion : trois compteurs, voir App\Security\LoginRateLimiter.
        login_email_ip:
            policy: "sliding_window"
            cache_pool: rate_limiter.cache
            lock_factory: null
            limit: 5
            interval: "15 minutes"
        login_ip:
            policy: "sliding_window"
            cache_pool: rate_limiter.cache
            lock_factory: null
            limit: 50
            interval: "15 minutes"
        login_email:
            policy: "sliding_window"
            cache_pool: rate_limiter.cache
            lock_factory: null
            limit: 20
            interval: "1 hour"

# Un test ne doit jamais échouer parce qu'un compteur partagé est plein.
when@test:
    framework:
        rate_limiter:
            # Sur disque pour ce test-là : la mémoire est vidée entre deux requêtes, et Redis n'est
            # pas forcément lancé sur la machine qui teste. Une clé par propriétaire (UUID neuf à
            # chaque test), donc aucun compteur partagé entre tests.
            moderation_alerts:
                cache_pool: rate_limiter.test_persistent
            booking_requests:
                limit: 1000
            quotes:
                limit: 1000
            registrations:
                limit: 1000
            password_resets:
                limit: 1000
            booking_recoveries:
                limit: 1000
            stay_alerts:
                limit: 1000
            listing_reports:
                limit: 1000
            login_email_ip:
                limit: 1000
            login_ip:
                limit: 1000
            login_email:
                limit: 1000
            listing_imports_owner:
                limit: 1000
            listing_imports_all:
                limit: 1000
            photo_uploads:
                limit: 1000

# Assez large pour travailler, assez bas pour croiser le 429 de temps en temps
# et se souvenir qu'il existe.
when@dev:
    framework:
        rate_limiter:
            booking_requests:
                limit: 30
            registrations:
                limit: 20
            password_resets:
                limit: 20
            booking_recoveries:
                limit: 20
            stay_alerts:
                limit: 20
            listing_reports:
                limit: 20
