api_platform:
    title: Cap Monta
    description: Location de mobil-homes, bungalows et caravanes au CHM Montalivet et à Euronat
    version: 0.1.0
    defaults:
        stateless: true
        cache_headers:
            vary: ["Content-Type", "Authorization", "Origin"]
        normalization_context:
            skip_null_values: false

when@prod:
    api_platform:
        # La documentation interactive décrit aussi les routes propriétaire : utile en
        # développement, rien à faire en ligne.
        enable_swagger_ui: false
        enable_re_doc: false
