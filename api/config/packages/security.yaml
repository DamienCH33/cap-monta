security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            json_login:
                check_path: api_login
                username_path: email
                password_path: password

            # 5 essais par adresse email et IP par quart d'heure (50 par IP) : sans ça, on peut
            # tester des mots de passe à l'infini. Redis en panne : voir ResilientLoginRateLimiter.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            logout:
                path: api_logout
                invalidate_session: true

    access_control:
        # Tout ce qui est sous /api/owner exige un compte propriétaire connecté.
        - { path: ^/api/owner, roles: ROLE_OWNER }

when@test:
    security:
        firewalls:
            main:
                login_throttling:
                    max_attempts: 1000
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
