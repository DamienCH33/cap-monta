framework:
    messenger:
        failure_transport: failed

        transports:
            # Messages différés (expiration d'une demande à 48 h) : transport Doctrine, ADR 005.
            # Ils survivent à un redémarrage. En dev, le worker est lancé par la CLI Symfony
            # avec le serveur (api/.symfony.local.yaml).
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                # Une panne SMTP dure des minutes, pas des secondes : 1 min, 3, 9, 27, 81 puis
                # ~4 h avant d'abandonner (file « failed », à surveiller : messenger:failed:show).
                retry_strategy:
                    max_retries: 6
                    delay: 60000
                    multiplier: 3
                    max_delay: 14400000
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            App\Message\ExpireBookingRequest: async
            App\Message\RemindOwnerOfBookingRequest: async
            # La lecture d'une annonce par l'IA ne se fait jamais pendant la requête du
            # propriétaire (ADR 027). Ses nouveaux essais sont gérés par le handler lui-même.
            App\Message\RunListingImport: async
            # Les emails partent par le worker : une panne SMTP ne fait plus échouer la requête
            # HTTP (la demande était enregistrée mais le voyageur voyait une erreur), et un envoi
            # raté est retenté.
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async

when@test:
    framework:
        messenger:
            transports:
                # Rien ne part vraiment : les tests lisent ce qui a été envoyé.
                async: 'in-memory://'
            routing:
                # Les tests vérifient le contenu des emails : envoyés tout de suite (vers null://).
                Symfony\Component\Mailer\Messenger\SendEmailMessage: sync
