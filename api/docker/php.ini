; Production. Photos : 10 Mo maximum par fichier (règle de l'API), un peu de marge.
upload_max_filesize = 12M
post_max_size = 14M
memory_limit = 256M
expose_php = Off
display_errors = Off
log_errors = On

; OPcache : le code ne change pas entre deux déploiements.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
